# Weekly pull requests for dependency updates, so security patches are not missed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Newer versions need Node 22+; update them together with Node (see README > Troubleshooting).
      - dependency-name: '@supabase/supabase-js'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: '@supabase/ssr'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
