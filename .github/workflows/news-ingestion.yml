name: News ingestion

# Calls the deployed app's cron endpoint every 2 hours. Optional: the app also
# refreshes itself when people open the feed (INGESTION_INTERVAL_MINUTES).
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   APP_URL      e.g. https://your-app.vercel.app   (no trailing slash)
#   CRON_SECRET  same value as the CRON_SECRET environment variable of the app

on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:

# This job only calls a URL; it needs no access to the repository.
permissions: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger ingestion
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::APP_URL or CRON_SECRET is not set - skipping (configure them to enable scheduled ingestion)."
            exit 0
          fi
          status=$(curl --silent --show-error --max-time 120 --output response.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/ingest")
          echo "HTTP $status"
          jq '{status, inserted, deleted, durationMs, failed: [.sources[]? | select(.ok == false) | {name, error}]}' response.json || cat response.json
          if [ "$status" -ge 400 ]; then
            echo "::error::Ingestion failed with HTTP $status"
            exit 1
          fi
